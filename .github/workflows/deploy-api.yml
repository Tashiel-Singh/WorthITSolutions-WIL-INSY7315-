name: Deploy API to Render
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Triggering Render API deploy..."
            CLEAN_HOOK=$(echo "$RENDER_HOOK" | tr -d '\r\n" ' )
            if [[ "$CLEAN_HOOK" =~ ^https?:// ]]; then
              curl -sS -m 30 -X POST "$CLEAN_HOOK" || echo "⚠️ Warning: Render API deploy webhook unreachable or returned non-zero. Continuing gracefully."
              echo "✅ Render API deployment trigger processed."
            else
              echo "ℹ️ RENDER_API_DEPLOY_HOOK does not begin with http(s)://. Skipping trigger."
            fi
          else
            echo "ℹ️ RENDER_API_DEPLOY_HOOK not configured in secrets. Skipping trigger."
          fi

name: Deploy Web to Render
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_HOOK" ]; then
            echo "Triggering Render Web deploy..."
            curl -fsS -X POST "$RENDER_HOOK"
          else
            echo "ℹ️ RENDER_WEB_DEPLOY_HOOK not configured in secrets. Skipping trigger."
          fi


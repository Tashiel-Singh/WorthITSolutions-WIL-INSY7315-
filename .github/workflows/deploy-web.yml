name: Deploy Web to Render
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        if: env.RENDER_HOOK != ''
        env:
          RENDER_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$RENDER_HOOK"
      - name: Deployment Notice
        if: env.RENDER_HOOK == ''
        env:
          RENDER_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
        run: echo "ℹ️ RENDER_WEB_DEPLOY_HOOK not set in secrets. Pipeline completed successfully."


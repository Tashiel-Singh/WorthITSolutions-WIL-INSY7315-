name: Keep API awake
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          API_HOST="${{ vars.API_HOST || 'medflow-api-wil26sc.onrender.com' }}"
          curl -sS --max-time 30 "https://$API_HOST/health" || echo "API ping attempt completed."

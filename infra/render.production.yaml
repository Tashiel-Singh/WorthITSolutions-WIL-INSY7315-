databases:
  - name: medflow-db-wil26sc
    databaseName: medflow
    user: medflow
    plan: free
services:
  - type: web
    name: medflow-api-wil26sc
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build --if-present
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: medflow-db-wil26sc
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: CORS_ORIGIN
        value: https://medflow-web-wil26sc.onrender.com,https://tashiel-singh.github.io,http://localhost:5173
  - type: web
    name: medflow-web-wil26sc
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: VITE_API_URL
        value: https://medflow-api-wil26sc.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
